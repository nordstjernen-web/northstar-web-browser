name: musl

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

env:
  NS_SAFE_BROWSING_API_KEY: ${{ secrets.NS_SAFE_BROWSING_API_KEY }}

concurrency:
  group: musl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-musl-${{ github.sha }}
          restore-keys: |
            ccache-musl-

      # A job container is pulled from one registry, and the job fails when
      # that registry throttles GitHub's shared runners (Docker Hub with 429
      # Too Many Requests, ECR Public with "Data limit exceeded"), so the
      # image is pulled from whichever mirror serves it and run by hand.
      - name: Pull the Alpine 3.24 image
        run: bash scripts/ci-pull-image.sh alpine:3.24

      - name: Build and smoke-test in an Alpine 3.24 container (musl libc)
        run: |
          docker run --rm --pull=never \
            -v "$PWD:/src" -w /src -e CCACHE_DIR=/src/.ccache \
            alpine:3.24 sh scripts/ci-musl.sh

      - name: Fix ownership of container-written files
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .
