<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Input events</title>
<!-- Driven by scripts/dev.sh smoke with the actions listed there. Each
     result line is written by the page as the actions run. -->
<style>
body { font: 16px sans-serif; margin: 0; }
#menu { position: fixed; left: 0; top: 0; width: 400px; height: 24px; }
#pick { position: absolute; left: 0; top: 0; width: 160px; height: 24px;
        font: 20px sans-serif; }
#cover { position: absolute; left: 0; top: 24px; width: 400px; height: 120px;
         background: #ddd; }
#term { position: absolute; left: 0; top: 160px; width: 200px; height: 40px;
        background: #888; }
#hidden { position: absolute; left: 0; top: 160px; width: 10px; height: 10px;
          opacity: 0; }
#field { position: absolute; left: 220px; top: 160px; width: 150px; }
#note { position: absolute; left: 0; top: 220px; width: 300px; height: 40px; }
#log { position: absolute; left: 0; top: 280px; margin: 0; }
</style>
</head>
<body>
<div id="menu">
  <select id="pick"><option>first</option><option>second</option><option>third</option></select>
  <!-- A later positioned sibling over the open list, as LogicEmu's title
       band is: the list must stay on top and take the click. -->
  <div id="cover"></div>
</div>
<div id="term"></div>
<textarea id="hidden"></textarea>
<input id="field">
<textarea id="note">positioned textarea text</textarea>
<pre id="log"></pre>
<script>
var log = document.getElementById('log');
function say(s) { log.textContent += s + '\n'; }
var pick = document.getElementById('pick');
pick.onchange = function() { say('picked: ' + pick.value); };
var hidden = document.getElementById('hidden');
/* A terminal that focuses a hidden field from a cancelled mousedown and
 * reads characters from keypress, as LogicEmu's terminals do. */
document.getElementById('term').onmousedown = function(e) {
  e.preventDefault();
  hidden.focus();
};
document.getElementById('term').onclick = function() {
  say('focused after click: ' + document.activeElement.id);
};
hidden.onkeypress = function(e) {
  say('terminal keypress ' + e.key + ' which=' + e.which);
  return false;
};
hidden.oninput = function() { say('terminal input (should not happen)'); };
var field = document.getElementById('field');
['keydown', 'keypress', 'keyup'].forEach(function(t) {
  field.addEventListener(t, function(e) { say('field ' + t + ' ' + e.key); });
});
field.addEventListener('input', function() { say('field input ' + field.value); });
</script>
</body>
</html>
