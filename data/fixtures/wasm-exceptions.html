<!doctype html>
<html>
<head><meta charset="utf-8"><title>WebAssembly exception handling</title></head>
<body>
<h1>WebAssembly exception handling</h1>
<ul id="out"></ul>
<script>
/* Legacy exception handling (try/catch/catch_all/throw/rethrow/delegate),
   as Emscripten's -fwasm-exceptions emits it. The module is assembled
   below so each case reads as its instruction sequence. */
function check(name, fn) {
  var result;
  try { result = fn(); } catch (e) { result = 'threw ' + (e && e.name); }
  var line = name + ': ' + result;
  if (typeof document !== 'undefined') {
    var li = document.createElement('li');
    li.textContent = line;
    document.getElementById('out').appendChild(li);
  } else {
    console.log(line);
  }
}

function uleb(n) { var o = []; do { var b = n & 0x7f; n >>>= 7; if (n) b |= 0x80; o.push(b); } while (n); return o; }
function sleb(n) {
  var o = [];
  for (;;) {
    var b = Number(BigInt.asUintN(7, BigInt(n)));
    n = BigInt(n) >> 7n;
    var done = (n === 0n && !(b & 0x40)) || (n === -1n && (b & 0x40));
    o.push(done ? b : b | 0x80);
    if (done) return o;
  }
}
function str(s) { return uleb(s.length).concat(Array.from(s, function (c) { return c.charCodeAt(0); })); }
function vec(items) { return uleb(items.length).concat.apply(uleb(items.length), items); }
function section(id, body) { return [id].concat(uleb(body.length), body); }

var I32 = 0x7f, I64 = 0x7e, VOID = 0x40;
var op = {
  unreachable: 0x00, block: 0x02, loop: 0x03, if_: 0x04, try_: 0x06,
  catch_: 0x07, throw_: 0x08, rethrow: 0x09, end: 0x0b, br: 0x0c,
  br_if: 0x0d, call: 0x10, delegate: 0x18, catch_all: 0x19, drop: 0x1a,
  get: 0x20, set: 0x21, i32: 0x41, i64: 0x42, eqz: 0x45, add: 0x6a,
  sub: 0x6b, shr_u64: 0x88, wrap: 0xa7
};
function i32(v) { return [op.i32].concat(sleb(v)); }
function i64(v) { return [op.i64].concat(sleb(v)); }

var types = [
  [[I32], []],        /* 0 */
  [[], [I32]],        /* 1 */
  [[I64, I32], []],   /* 2 */
  [[], [I64, I32]],   /* 3 */
  [[I32], [I32]],     /* 4 */
  [[], []]            /* 5 */
];
var E = 0, E2 = 1;     /* tags */
/* imported functions come first: env.js_throw, env.reenter, env.js_error */
var JS_THROW = 0, REENTER = 1, JS_ERROR = 2, N_IMPORTS = 3;
var THROWER = N_IMPORTS + 0, DELEGATE_FN = N_IMPORTS + 6, REC = N_IMPORTS + 12;

/* [name or null, type, locals, body] */
var funcs = [
  [null, 0, [], [op.get, 0, op.throw_, E]],
  ['same', 1, [], [op.try_, I32].concat(i32(42), [op.throw_, E, op.catch_, E, op.end])],
  ['callee', 1, [], [op.try_, I32].concat(i32(7), [op.call, THROWER], i32(0),
                     [op.catch_, E], i32(1), [op.add, op.end])],
  ['nothrow', 1, [], [op.try_, I32].concat(i32(5), [op.catch_all], i32(6), [op.end])],
  ['rethrow', 1, [], [op.try_, I32, op.try_, VOID].concat(i32(3), [op.call, THROWER,
                      op.catch_all, op.rethrow, 0, op.end], i32(0), [op.catch_, E, op.end])],
  ['delegate', 1, [], [op.try_, I32, op.try_, VOID].concat(i32(9), [op.call, THROWER,
                       op.delegate, 0], i32(0), [op.catch_, E], i32(100), [op.add, op.end])],
  ['delegate_fn', 5, [], [op.try_, VOID].concat(i32(11), [op.call, THROWER, op.delegate, 0])],
  ['delegate_caller', 1, [], [op.try_, I32, op.call, DELEGATE_FN].concat(i32(0), [op.catch_, E, op.end])],
  ['uncaught', 5, [], i32(1).concat([op.throw_, E])],
  ['loop', 4, [I32], [op.block, VOID, op.loop, VOID, op.get, 0, op.eqz, op.br_if, 1,
                      op.try_, VOID, op.get, 0, op.call, THROWER, op.catch_, E,
                      op.get, 1, op.add, op.set, 1, op.end,
                      op.get, 0].concat(i32(1), [op.sub, op.set, 0, op.br, 0, op.end, op.end,
                      op.get, 1])],
  ['multi', 1, [I32], [op.try_, 3].concat(i64(0x100000000), i32(5), [op.throw_, E2,
                       op.catch_, E2, op.end, op.set, 0], i64(32), [op.shr_u64, op.wrap,
                       op.get, 0, op.add])],
  ['catch_body', 1, [], [op.try_, I32, op.try_, I32].concat(i32(1), [op.call, THROWER],
                         i32(0), [op.catch_, E], i32(20), [op.add, op.call, THROWER],
                         i32(0), [op.end, op.catch_, E, op.end])],
  [null, 4, [], [op.get, 0, op.eqz, op.if_, VOID].concat(i32(77), [op.call, THROWER, op.end,
                 op.get, 0], i32(1), [op.sub, op.call, REC])],
  ['deep', 1, [], [op.try_, I32].concat(i32(1000), [op.call, REC, op.catch_, E, op.end])],
  ['nested_block', 1, [], [op.try_, I32].concat(i32(1), i32(2), [op.block, I32], i32(50),
                           [op.call, THROWER], i32(0), [op.end, op.add, op.add,
                           op.catch_, E, op.end])],
  ['trap', 1, [], [op.try_, I32, op.unreachable, op.catch_all].concat(i32(1), [op.end])],
  ['locals', 1, [I32], [op.try_, I32].concat(i32(5), [op.set, 0], i32(0), [op.call, THROWER],
                        i32(0), [op.catch_, E, op.drop, op.get, 0, op.end])],
  ['from_js', 1, [], [op.try_, I32].concat(i32(31), [op.call, JS_THROW], i32(0),
                      [op.catch_, E, op.end])],
  ['through_js', 1, [], [op.try_, I32, op.call, REENTER].concat(i32(0),
                         [op.catch_, E], i32(1000), [op.add, op.end])],
  ['js_catch_all', 1, [], [op.try_, I32, op.call, JS_ERROR].concat(i32(0),
                           [op.catch_all], i32(7), [op.end])],
  ['js_rethrow', 5, [], [op.try_, VOID, op.call, JS_ERROR, op.catch_all,
                         op.rethrow, 0, op.end]],
  ['js_not_tag', 1, [], [op.try_, I32, op.call, JS_ERROR].concat(i32(0),
                         [op.catch_, E, op.end])]
];

var bytes = [0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00];
bytes = bytes.concat(section(1, vec(types.map(function (t) {
  return [0x60].concat(vec(t[0].map(function (v) { return [v]; })),
                       vec(t[1].map(function (v) { return [v]; })));
}))));
bytes = bytes.concat(section(2, vec([
  str('env').concat(str('js_throw'), [0x00], uleb(0)),
  str('env').concat(str('reenter'), [0x00], uleb(5)),
  str('env').concat(str('js_error'), [0x00], uleb(5))
])));
bytes = bytes.concat(section(3, vec(funcs.map(function (f) { return uleb(f[1]); }))));
bytes = bytes.concat(section(13, vec([[0x00].concat(uleb(0)), [0x00].concat(uleb(2))])));
var exps = [];
funcs.forEach(function (f, i) { if (f[0]) exps.push(str(f[0]).concat([0x00], uleb(N_IMPORTS + i))); });
exps.push(str('tag').concat([0x04], uleb(E)));
bytes = bytes.concat(section(7, vec(exps)));
bytes = bytes.concat(section(10, vec(funcs.map(function (f) {
  var locals = vec(f[2].map(function (t) { return [1, t]; }));
  var body = locals.concat(f[3], [op.end]);
  return uleb(body.length).concat(body);
}))));
bytes = new Uint8Array(bytes);

check('module validates', function () { return WebAssembly.validate(bytes); });
var ex = null;
var imports = {
  env: {
    js_throw: function (v) { throw new WebAssembly.Exception(ex.tag, [v]); },
    reenter: function () { ex.uncaught(); },
    js_error: function () { throw jsError; }
  }
};
var jsError = new TypeError('from JS');
ex = new WebAssembly.Instance(new WebAssembly.Module(bytes), imports).exports;
check('throw and catch in one function', function () { return ex.same(); });
check('catch an exception thrown by a callee', function () { return ex.callee(); });
check('try body without an exception', function () { return ex.nothrow(); });
check('catch_all then rethrow to the outer try', function () { return ex.rethrow(); });
check('delegate to the outer try', function () { return ex.delegate(); });
check('delegate to the caller', function () { return ex.delegate_caller(); });
check('uncaught exception leaves wasm', function () { ex.uncaught(); return 'returned'; });
check('uncaught exception carries the exported tag', function () {
  try { ex.uncaught(); return 'returned'; } catch (e) {
    return (e instanceof WebAssembly.Exception) + ' is=' + e.is(ex.tag) +
           ' arg=' + e.getArg(ex.tag, 0);
  }
});
check('exported tag is a WebAssembly.Tag', function () { return ex.tag instanceof WebAssembly.Tag; });
check('WebAssembly.Exception thrown by an import is caught', function () { return ex.from_js(); });
check('wasm exception through a JS frame is caught', function () { return ex.through_js(); });
check('catch_all takes a JS error thrown by an import', function () { return ex.js_catch_all(); });
check('rethrow of a JS error leaves wasm as the same object', function () {
  try { ex.js_rethrow(); return 'returned'; } catch (e) { return e === jsError; }
});
check('a tag catch does not take a JS error', function () {
  try { return ex.js_not_tag(); } catch (e) { return 'threw same=' + (e === jsError); }
});
check('foreign tag does not match', function () {
  var other = new WebAssembly.Tag({ parameters: ['i32'] });
  var e = new WebAssembly.Exception(other, [1]);
  return e.is(ex.tag) + ' ' + e.is(other);
});
check('catch inside a loop, 100 times', function () { return ex.loop(100); });
check('multi-value payload (i64, i32)', function () { return ex.multi(); });
check('throw from a catch body to the outer try', function () { return ex.catch_body(); });
check('unwind 1000 frames', function () { return ex.deep(); });
check('operand stack inside a nested block', function () { return ex.nested_block(); });
check('a trap is not caught by catch_all', function () { return ex.trap(); });
check('locals set before the throw', function () { return ex.locals(); });
check('instance still works after an uncaught exception', function () { return ex.same(); });
</script>
</body>
</html>
