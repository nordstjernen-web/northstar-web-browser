name: muon

# Builds the browser with muon (https://muon.build), the C implementation
# of meson, instead of meson itself, so a change that only meson accepts
# is caught. docs/building.md, "Building with muon", has the details.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: muon-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NS_SAFE_BROWSING_API_KEY: ${{ secrets.NS_SAFE_BROWSING_API_KEY }}
  # The muon release the job builds with, and the commit its tag names.
  MUON_VERSION: '0.7.1'
  MUON_COMMIT: dca69abaa0ee71063fc89c5f2df9acf35f1512ab

jobs:
  build:
    name: gcc on ubuntu-26.04, configured and built by muon
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        # The browser's dependencies are linux.yml's, without meson and
        # ninja; libarchive-dev is for muon, which needs libcurl and
        # libarchive to fetch and unpack the wrap-file subprojects.
        timeout-minutes: 15
        run: |
          apt_get() {
            sudo timeout -k 10 "$1" apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o DPkg::Lock::Timeout=120 \
              "${@:2}"
          }
          for attempt in 1 2 3; do
            if apt_get 120 update && apt_get 240 install -y \
                ccache gcc pkg-config git python3 \
                libcurl4-openssl-dev libarchive-dev \
                libgtk-4-dev libssl-dev \
                libharfbuzz-dev libfribidi-dev libcairo2-dev \
                libfontconfig-dev libfreetype-dev \
                libpsl-dev libsqlite3-dev \
                libavif-dev libsdl3-dev libseccomp-dev libenchant-2-dev \
                libopusfile-dev libvorbis-dev libepoxy-dev glslang-dev \
                libegl1 libgl1-mesa-dri ca-certificates; then
              exit 0
            fi
            echo "::warning::apt-get attempt $attempt failed or timed out"
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1

      - name: Restore muon
        id: muon-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/muon
          # Rebuilt whenever this file changes, so a change to the muon
          # build below never runs against a cached binary from before it.
          key: muon-${{ env.MUON_VERSION }}-ubuntu-26.04-${{ hashFiles('.github/workflows/muon.yml') }}

      - name: Build muon
        if: steps.muon-cache.outputs.cache-hit != 'true'
        # muon bootstraps itself: a first binary compiled from one C file
        # builds the real one. The libpkgconf backend is left out: it does
        # not search Ubuntu's multiarch pkg-config directory, so it misses
        # GTK and every other system library; muon then runs pkg-config.
        run: |
          git clone --depth 1 --branch "$MUON_VERSION" \
            https://github.com/muon-build/muon.git "$RUNNER_TEMP/muon"
          cd "$RUNNER_TEMP/muon"
          test "$(git rev-parse HEAD)" = "$MUON_COMMIT"
          CC=cc ./bootstrap.sh build
          build/muon-bootstrap setup -Dbuildtype=release \
            -Dlibcurl=enabled -Dlibarchive=enabled -Dlibpkgconf=disabled \
            -Dsamurai=enabled -Ddocs=disabled -Dman-pages=disabled \
            -Dmeson-docs=disabled -Dmeson-tests=disabled \
            build
          build/muon-bootstrap -C build samu
          mkdir -p ~/.local/muon
          cp build/muon ~/.local/muon/muon

      - name: Add muon to PATH
        run: echo "$HOME/.local/muon" >> "$GITHUB_PATH"

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-muon-ubuntu-26.04-gcc-${{ github.sha }}
          restore-keys: |
            ccache-muon-ubuntu-26.04-gcc-

      - name: Configure ccache
        run: |
          ccache --max-size=400M
          ccache --zero-stats

      - name: Select compiler
        run: echo "CC=ccache gcc" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        run: |
          gcc --version | head -1
          ccache --version | head -1
          muon version
          pkg-config --modversion gtk4
          pkg-config --modversion libcurl

      - name: Configure
        # Pull requests build without LTO, as in linux.yml; pushes to main
        # keep the release configuration with LTO.
        run: |
          lto=true; [ "$GITHUB_EVENT_NAME" = pull_request ] && lto=false
          muon setup -Dwerror=true -Db_lto=$lto builddir

      - name: Check the subprojects carry every patch
        # muon fetches and patches the subprojects itself; this fails if it
        # left out any of the patches or overlays a wrap names.
        run: bash scripts/check-subprojects.sh

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          muon -C builddir samu 2>&1 | tee build.log

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Smoke test (binary present, executable and PIE)
        run: |
          test -x builddir/src/gtk/northstar
          file builddir/src/gtk/northstar
          readelf -h builddir/src/gtk/northstar | grep -q 'DYN'
          ldd builddir/src/gtk/northstar | head -20

      - name: Headless smoke (about:start)
        run: |
          set -o pipefail
          ./builddir/src/gtk/northstar --headless --dump=text about:start > about.txt
          head -3 about.txt
          grep -q 'Search duckduckgo.com' about.txt

      - name: Headless PDF viewer smoke
        shell: bash
        run: |
          set -o pipefail
          ./builddir/src/gtk/northstar --headless --dump=text --settle-ms=8000 \
            data/fixtures/compressed-text.pdf > pdf.txt
          grep -q NSPDF-START pdf.txt
          grep -q NSPDF-END pdf.txt

      - name: Headless JavaScript smoke
        shell: bash
        run: |
          set -o pipefail
          ./builddir/src/gtk/northstar --headless --dump=dom about:northstar > about-js.txt
          grep -qF '"JavaScript (quickjs-ng)"' about-js.txt
          ./builddir/src/gtk/northstar --headless --dump=text --settle-ms=300 \
            'data:text/html,<p id="a">before</p><script>var a=document.getElementById("a");var n=0;[1,1].sort(function(){n++;return 0});a.textContent="js-dom-ok "+(6*7)+" "+(2n**65n)+" "+structuredClone([1,[2]])[1][0]+" enc="+new TextEncoder().encode("hé").length+" sortcmp="+n;Promise.resolve().then(function(){a.textContent+=" js-microtask-ok"});setTimeout(function(){a.textContent+=" js-timer-ok"},50);</script>' \
            > js-page.txt
          cat js-page.txt
          grep -q 'js-dom-ok 42 36893488147419103232 2 enc=3 sortcmp=1' js-page.txt
          grep -q 'js-microtask-ok' js-page.txt
          grep -q 'js-timer-ok' js-page.txt

      - name: Headless WebGL smoke (Mesa software rendering)
        shell: bash
        run: |
          set -o pipefail
          ./builddir/src/gtk/northstar --headless --dump=text --settle-ms=500 \
            data/fixtures/webgl.html > webgl.txt
          cat webgl.txt
          grep -qx 'webgl1 left=255,128,0,255' webgl.txt
          grep -qx 'webgl1 error=0' webgl.txt
          grep -qx 'webgl2 es300=true' webgl.txt
          grep -qx 'webgl2 error=0' webgl.txt

      - name: Headless baseline smoke (./scripts/dev.sh smoke)
        run: ./scripts/dev.sh smoke

      - name: Install into a staging directory
        run: |
          muon -C builddir install -d "$RUNNER_TEMP/stage"
          test -x "$RUNNER_TEMP/stage/usr/local/bin/northstar"
          test -f "$RUNNER_TEMP/stage/usr/local/share/applications/org.northstar.WebBrowser.desktop"

      - name: Upload build log
        if: always() && hashFiles('build.log') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-muon-ubuntu-26.04-gcc
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
