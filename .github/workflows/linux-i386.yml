name: linux-i386

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: linux-i386-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: gcc on debian-13 i386
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Actions run on the 64-bit host; only the build runs in the 32-bit
      # container, since the runner's node binary cannot execute in one.
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-i386-${{ github.sha }}
          restore-keys: |
            ccache-linux-i386-

      # Docker's default seccomp profile on the runner blocks a syscall
      # the 32-bit glibc resolver needs, so every DNS lookup in the
      # container fails ("Temporary failure resolving") while 64-bit
      # containers resolve fine. The job VM is disposable; drop the
      # profile for this container. Registries throttle anonymous pulls
      # from the shared runners (Docker Hub with 429 Too Many Requests,
      # ECR Public with "Data limit exceeded"), so the image is pulled from
      # whichever mirror of Docker's official images serves it.
      - name: Pull the i386 Debian 13 image
        run: bash scripts/ci-pull-image.sh debian:trixie linux/386

      - name: Build and smoke-test in an i386 Debian 13 container
        run: |
          docker run --rm --pull=never --platform linux/386 \
            --security-opt seccomp=unconfined \
            -v "$PWD:/src" -w /src -e CCACHE_DIR=/src/.ccache \
            -e NS_CI_LTO=$([ "$GITHUB_EVENT_NAME" = pull_request ] && echo false || echo true) \
            debian:trixie bash scripts/ci-linux-i386.sh

      - name: Fix ownership of container-written files
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Upload build log
        if: always() && hashFiles('build-i386.log') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-linux-i386
          path: build-i386.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload northstar binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: northstar-linux-i386
          path: builddir-i386/src/gtk/northstar
          if-no-files-found: error
          retention-days: 14
