name: linux

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NS_SAFE_BROWSING_API_KEY: ${{ secrets.NS_SAFE_BROWSING_API_KEY }}

jobs:
  build:
    name: gcc on ubuntu-${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['26.04']

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache gcc pkg-config meson ninja-build \
            libgtk-4-dev libcurl4-openssl-dev libssl-dev \
            libharfbuzz-dev libfribidi-dev libcairo2-dev \
            libfontconfig-dev libfreetype-dev \
            libuchardet-dev libpsl-dev libsqlite3-dev \
            libavif-dev libsdl2-dev libseccomp-dev libenchant-2-dev \
            libopusfile-dev libvorbis-dev ca-certificates

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.ubuntu }}-gcc-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.ubuntu }}-gcc-

      - name: Configure ccache
        run: |
          ccache --max-size=400M
          ccache --zero-stats

      - name: Select compiler
        run: |
          echo "CC=ccache gcc" >> $GITHUB_ENV

      - name: Show toolchain versions
        run: |
          gcc --version | head -1
          ccache --version | head -1
          meson --version
          ninja --version
          pkg-config --modversion gtk4
          pkg-config --modversion libcurl

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          # Pull requests build without LTO (several times faster to link);
          # pushes to main keep the release configuration with LTO.
          lto=true; [ "$GITHUB_EVENT_NAME" = pull_request ] && lto=false
          meson setup builddir --werror -Db_lto=$lto
          meson compile -C builddir 2>&1 | tee build.log

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Smoke test (binary present and executable)
        run: |
          test -x builddir/src/gtk/northstar
          file builddir/src/gtk/northstar
          ldd builddir/src/gtk/northstar | head -20

      - name: Headless smoke (about:start)
        run: |
          set -o pipefail
          ./builddir/src/gtk/northstar --headless --dump=text about:start > about.txt
          head -3 about.txt
          grep -q nordstjernen.org about.txt

      - name: Headless JavaScript smoke (engine named, scripts run on it)
        shell: bash
        run: |
          set -o pipefail
          ./builddir/src/gtk/northstar --headless --dump=text about:northstar > about-js.txt
          grep -qxF 'JavaScript (quickjs-ng)' about-js.txt
          ./builddir/src/gtk/northstar --headless --dump=text --settle-ms=300 \
            'data:text/html,<p id="a">before</p><script>var a=document.getElementById("a");var n=0;[1,1].sort(function(){n++;return 0});a.textContent="js-dom-ok "+(6*7)+" "+(2n**65n)+" "+structuredClone([1,[2]])[1][0]+" enc="+new TextEncoder().encode("h\u00e9").length+" sortcmp="+n;Promise.resolve().then(function(){a.textContent+=" js-microtask-ok"});setTimeout(function(){a.textContent+=" js-timer-ok"},50);</script>' \
            > js-page.txt
          cat js-page.txt
          grep -q 'js-dom-ok 42 36893488147419103232 2 enc=3 sortcmp=1' js-page.txt
          grep -q 'js-microtask-ok' js-page.txt
          grep -q 'js-timer-ok' js-page.txt

      - name: Headless baseline smoke (./scripts/dev.sh smoke)
        run: ./scripts/dev.sh smoke

      - name: Upload build log
        if: always() && hashFiles('build.log') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-${{ matrix.ubuntu }}-gcc
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload northstar binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: northstar-linux-${{ matrix.ubuntu }}-gcc
          path: builddir/src/gtk/northstar
          if-no-files-found: error
          retention-days: 14
